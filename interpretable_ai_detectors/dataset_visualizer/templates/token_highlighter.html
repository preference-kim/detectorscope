<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Token Highlighter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .token-highlight {
            padding: 0.1em 0.3em;
            margin: 0.1em;
            border-radius: 0.25rem;
            display: inline-block;
            line-height: 1.5;
            transition: all 0.2s ease-in-out;
        }
        .token-highlight:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .tooltip {
            position: relative;
            display: inline-block;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: #334155;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #334155 transparent transparent transparent;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .controls-hidden {
            visibility: hidden;
        }
        /* Hide arrows on number input for a cleaner look */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-5xl bg-white rounded-lg shadow-xl p-8 space-y-6">

        <div class="text-center">
            <h1 class="text-3xl font-bold text-slate-900">Dataset Token Visualizer</h1>
            <p id="dataset-info" class="text-slate-500 mt-2">Loading dataset information...</p>
        </div>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg" role="alert">
            <strong class="font-bold">Error:</strong>
            <span class="block sm:inline" id="error-text"></span>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-lg items-center">
             <div class="flex items-center gap-4 justify-center md:justify-start">
                <label for="color-select" class="text-sm font-medium text-slate-700">Highlight Color:</label>
                <select id="color-select" class="rounded-md border-slate-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 transition">
                    <option value="blue" selected>Blue</option>
                    <option value="red">Red</option>
                    <option value="green">Green</option>
                    <option value="purple">Purple</option>
                    <option value="orange">Orange</option>
                </select>
            </div>

            <!-- Feature Selector is now a text input -->
            <div id="feature-controls" class="flex items-center gap-2 justify-center controls-hidden">
                <label for="feature-input" class="text-sm font-medium text-slate-700">Feature:</label>
                <input type="number" id="feature-input" class="rounded-md border-slate-300 shadow-sm focus:ring-blue-500 focus:border-blue-500 transition w-20 text-center py-2" min="1">
                <span id="feature-total" class="font-mono text-sm text-slate-700"></span>
            </div>

            <!-- Row Selector -->
            <div class="flex items-center gap-2 justify-center md:justify-end">
                <button id="prev-row-btn" class="bg-slate-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-slate-700 transition-transform transform hover:scale-105">&lt; Row</button>
                <span id="row-display" class="font-mono text-sm text-slate-700 whitespace-nowrap text-center">Row 0 / 0</span>
                <button id="next-row-btn" class="bg-slate-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-slate-700 transition-transform transform hover:scale-105">Row &gt;</button>
            </div>
        </div>

        <!-- Feature Explanation Box -->
        <div id="explanation-container" class="hidden">
            <h2 class="text-xl font-semibold mb-2 text-slate-900">Feature Explanation</h2>
            <div id="explanation-text" class="p-4 border border-slate-200 rounded-lg bg-slate-50 text-slate-700 min-h-[50px] leading-relaxed">
                Loading explanation...
            </div>
        </div>

        <div>
            <h2 class="text-xl font-semibold mb-3 text-slate-900">Result</h2>
            <!-- Added flex-wrap to allow tokens to wrap to the next line -->
            <div id="output" class="p-6 border-2 border-dashed border-slate-300 rounded-lg min-h-[150px] text-lg leading-relaxed bg-slate-50 flex flex-wrap items-center justify-center">
                <span class="text-slate-500">Loading data...</span>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let totalRows = 0;
        let currentFeatureIndex = -1; // Initialize to -1 to force fetch on first load
        let featureDimension = 1;

        let activeRowIndices = []; // List of dataset indices where the feature is active
        let currentActiveIndex = 0; // The index within the activeRowIndices array

        let currentTokens = [];
        let currentValues = [];

        // --- Element References ---
        const prevRowBtn = document.getElementById('prev-row-btn');
        const nextRowBtn = document.getElementById('next-row-btn');
        const featureInput = document.getElementById('feature-input');
        const featureTotalSpan = document.getElementById('feature-total');
        const outputDiv = document.getElementById('output');
        const errorMessageDiv = document.getElementById('error-message');
        const errorTextSpan = document.getElementById('error-text');
        const colorSelect = document.getElementById('color-select');
        const rowDisplay = document.getElementById('row-display');
        const datasetInfo = document.getElementById('dataset-info');
        const featureControls = document.getElementById('feature-controls');
        const explanationContainer = document.getElementById('explanation-container');
        const explanationTextDiv = document.getElementById('explanation-text');


        // --- Utility Functions ---
        function showError(message) {
            errorTextSpan.textContent = message;
            errorMessageDiv.classList.remove('hidden');
        }

        function hideError() {
            errorMessageDiv.classList.add('hidden');
        }

        function normalize(values) {
            if (!values || values.length === 0) return [];
            const min = Math.min(...values);
            const max = Math.max(...values);
            if (min === max) return values.map(() => 0.5);
            return values.map(val => (val - min) / (max - min));
        }

        const colorMap = {
            blue: { h: 210, s: 90 }, red: { h: 0, s: 90 }, green: { h: 130, s: 70 },
            purple: { h: 270, s: 80 }, orange: { h: 30, s: 90 },
        };

        function getValueColor(value, selectedColor) {
            const { h, s } = colorMap[selectedColor];
            const lightness = 95 - (value * 45);
            const alpha = 0.4 + (value * 0.6);
            return `hsla(${h}, ${s}%, ${lightness}%, ${alpha})`;
        }

        // --- Core Rendering Logic ---
        function generateVisualization(tokens, values) {
            outputDiv.innerHTML = '';
            outputDiv.classList.remove('justify-center');
            outputDiv.classList.add('justify-start');

            const normalizedValues = normalize(values);
            const selectedColor = colorSelect.value;

            tokens.forEach((token, index) => {
                const originalValue = values[index];
                const normalizedValue = normalizedValues[index];
                const color = getValueColor(normalizedValue, selectedColor);
                const container = document.createElement('span');
                container.className = 'tooltip';
                const span = document.createElement('span');
                span.textContent = token;
                span.className = 'token-highlight';
                span.style.backgroundColor = color;
                span.style.color = normalizedValue > 0.6 ? 'white' : 'black';
                const tooltipText = document.createElement('span');
                tooltipText.className = 'tooltiptext';
                tooltipText.textContent = `Value: ${originalValue.toFixed(4)}`;
                container.appendChild(span);
                container.appendChild(tooltipText);
                outputDiv.appendChild(container);
                outputDiv.appendChild(document.createTextNode(' '));
            });
        }

        // --- UI Update Functions ---
        function updateRowUI() {
            if (activeRowIndices.length > 0) {
                const datasetIndex = activeRowIndices[currentActiveIndex];
                rowDisplay.innerHTML = `Active: ${currentActiveIndex + 1} / ${activeRowIndices.length}<br><span class="text-xs">Dataset Idx: ${datasetIndex}</span>`;
            } else {
                rowDisplay.textContent = 'No active rows';
            }
            prevRowBtn.disabled = currentActiveIndex <= 0;
            nextRowBtn.disabled = currentActiveIndex >= activeRowIndices.length - 1;
        }

        function updateFeatureUI() {
            if (featureDimension > 1) {
                featureControls.classList.remove('controls-hidden');
                featureInput.max = featureDimension;
                featureInput.min = 1;
                featureInput.value = currentFeatureIndex + 1;
                featureTotalSpan.textContent = `/ ${featureDimension}`;
            } else {
                featureControls.classList.add('controls-hidden');
                explanationContainer.classList.add('hidden');
            }
        }

        // --- Data Fetching ---
        async function fetchRowData(datasetIndex, featureIndex) {
            outputDiv.innerHTML = `<span class="text-slate-500">Loading row ${datasetIndex}, feature ${featureIndex + 1}...</span>`;
            outputDiv.classList.remove('justify-start');
            outputDiv.classList.add('justify-center');

            try {
                const response = await fetch(`/api/row/${datasetIndex}/${featureIndex}`);
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Row Data Error: ${errorData.error || response.status}`);
                }
                const rowData = await response.json();

                currentTokens = rowData.tokens;
                currentValues = rowData.values;

                updateRowUI();
                generateVisualization(currentTokens, currentValues);

            } catch (error) {
                showError(error.message);
                outputDiv.innerHTML = '';
            }
        }

        async function fetchFeatureData(featureIndex) {
            hideError();
            currentFeatureIndex = featureIndex;

            if (featureDimension > 1) {
                explanationContainer.classList.remove('hidden');
                explanationTextDiv.innerHTML = `<span class="text-slate-500">Loading explanation for feature ${featureIndex + 1}...</span>`;
            }

            try {
                const [explanationResponse, activeRowsResponse] = await Promise.all([
                    fetch(`/api/feature_explanation/${featureIndex}`),
                    fetch(`/api/active_rows/${featureIndex}`)
                ]);

                if (!explanationResponse.ok) {
                    const errorData = await explanationResponse.json();
                    throw new Error(`Explanation Error: ${errorData.error || explanationResponse.status}`);
                }
                if (!activeRowsResponse.ok) {
                    const errorData = await activeRowsResponse.json();
                    throw new Error(`Active Rows Error: ${errorData.error || activeRowsResponse.status}`);
                }

                const explanationData = await explanationResponse.json();
                explanationTextDiv.textContent = explanationData.explanation;

                const activeRowsData = await activeRowsResponse.json();

                // **FIX:** Add robust check to ensure active_rows is a valid array
                if (Array.isArray(activeRowsData.active_rows)) {
                    activeRowIndices = activeRowsData.active_rows;
                } else {
                    activeRowIndices = [];
                    console.error("API for active rows did not return a valid list.", activeRowsData);
                    throw new Error("Invalid data format for active rows from server.");
                }

                currentActiveIndex = 0;

                updateFeatureUI();

                if (activeRowIndices.length > 0) {
                    // Fetch the first active row using its actual dataset index
                    await fetchRowData(activeRowIndices[0], featureIndex);
                } else {
                    // Handle case where there are no active documents for a feature
                    outputDiv.innerHTML = '<span class="text-slate-500">No active documents for this feature.</span>';
                    currentTokens = [];
                    currentValues = [];
                    updateRowUI();
                }
            } catch (error) {
                showError(error.message);
                explanationTextDiv.textContent = 'Failed to load feature data.';
                outputDiv.innerHTML = '';
                 // Ensure UI is updated correctly on error
                activeRowIndices = [];
                updateRowUI();
            }
        }

        async function initialize() {
            try {
                const response = await fetch('/api/info');
                 if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }
                const info = await response.json();
                totalRows = info.total_rows;
                featureDimension = info.featureDimension;
                datasetInfo.textContent = `Visualizing ${info.dataset_name} (${info.text_column} / ${info.values_column})`;

                await fetchFeatureData(0);
            } catch(error) {
                showError(`Failed to load dataset info: ${error.message}`);
            }
        }

        // --- Event Listeners ---
        prevRowBtn.addEventListener('click', () => {
            if (currentActiveIndex > 0) {
                currentActiveIndex--;
                const datasetIndex = activeRowIndices[currentActiveIndex];
                fetchRowData(datasetIndex, currentFeatureIndex);
            }
        });

        nextRowBtn.addEventListener('click', () => {
            if (currentActiveIndex < activeRowIndices.length - 1) {
                currentActiveIndex++;
                const datasetIndex = activeRowIndices[currentActiveIndex];
                fetchRowData(datasetIndex, currentFeatureIndex);
            }
        });

        featureInput.addEventListener('change', () => {
            let newIndex = parseInt(featureInput.value, 10) - 1;

            if (isNaN(newIndex) || newIndex < 0 || newIndex >= featureDimension) {
                featureInput.value = currentFeatureIndex + 1;
                showError(`Invalid feature index. Please enter a number between 1 and ${featureDimension}.`);
                return;
            }
            fetchFeatureData(newIndex);
        });

        colorSelect.addEventListener('change', () => {
            if (currentTokens.length > 0) {
                generateVisualization(currentTokens, currentValues);
            }
        });

        window.onload = initialize;
    </script>
</body>
</html>
