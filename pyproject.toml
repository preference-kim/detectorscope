[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detector_scope"
dynamic = ["version"]
version = "0.1.0"
authors = [
  { name="Liam Dugan", email="liamdugan@google.com" },
]
description = "A tool for mechanistically grounded interpretable AI detectors."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "datasets~=4.0.0",
  "torch~=2.8.0",
  "sae_lens~=6.6.4",
  "tensorboard~=2.20.0",
  "torchmetrics~=1.8.1",
  "google-genai~=1.30.0",
  "flask~=3.1.2",
  "more_itertools~=10.8.0",
  "matplotlib~=3.10.7",
  "tbparse~=0.0.9",
  "titlecase~=2.4.1",
  "scikit-learn~=1.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]
