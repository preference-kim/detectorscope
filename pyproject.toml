[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detectorscope"
version = "0.0.1"
authors = [
  { name="Liam Dugan", email="ldugan@seas.upenn.edu" },
]
description = "A tool for mechanistically grounded interpretable AI detectors."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.34",
  "safetensors>=0.4.3",
  "torch>=2.6,<3",
  "transformers>=4.57,<6",
]

[project.optional-dependencies]
xgboost = ["xgboost~=3.2.0"]
train = [
  "accelerate~=1.13",
  "datasets~=4.0",
  "google-genai~=1.56",
  "matplotlib~=3.10",
  "more_itertools>=10.8",
  "pandas~=2.0",
  "pyyaml~=6.0",
  "scikit-learn~=1.7.2",
  "scipy>=1.15,<2",
  "sentence-transformers~=5.4",
  "tensorboard~=2.20",
  "torch>=2.8,<3",
  "tqdm~=4.67",
  "transformers>=4.57,<6",
  "typing_extensions>=4.4",
  "detectorscope[xgboost]",
]
demo = ["gradio~=5.50", "pandas~=2.0", "pyyaml~=6.0", "spaces>=0.51"]
analysis = [
  "adjustText",
  "ipykernel",
  "jinja2",
  "plotly",
  "pyarrow",
  "seaborn~=0.13",
  "statsmodels",
]
data = ["titlecase>=2.4"]
adversarial = ["rapidfuzz"]
all = ["detectorscope[train,demo,analysis,data,adversarial]"]

[tool.setuptools.packages.find]
include = ["detectorscope*"]

[tool.setuptools.package-data]
detectorscope = [
  "prompts/*.txt",
  "model/detectors/baselines/resources/fdgpt_calibration.json",
]

[tool.pyink]
line-length = 80
target-version = ["py310"]
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.pytype]
inputs = ["detectorscope"]
python_version = "3.11"
